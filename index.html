<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">

<meta name="theme-color" content="#0d1317">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">

<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>:root{padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px);box-sizing:border-box}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Tavolo di Prova</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Impianto: un tappetino da duello sempre scuro al centro, comandi essenziali attorno.
   Telefono: tappetino a 5 colonne con le pile in una riga bassa, mano sotto, azioni in fondo.
   PC: tappetino a 7 colonne come quello vero, a destra la carta ingrandita e la cronologia. */
:root {
  color-scheme: dark;
  --bg: #0d1317; --surface: #161f25; --surface-2: #1e2a32; --line: #2b3a44; --fg: #e9eff1; --muted: #94a6af;
  --accent: #f2b441; --accent-fg: #1c1303; --accent-ink: #f2b441; --pick: #55d6ea; --bad: #ff7466; --good: #6fd08c;
  --mat-1: #12343f; --mat-2: #0a2029; --mat-line: rgba(255,255,255,.17); --mat-zone: rgba(255,255,255,.055); --mat-fg: #e3eef0; --mat-muted: #8eb0b9;
  --f-normal: #c8a45c; --f-effect: #bf6c38; --f-ritual: #4c7cc2; --f-fusion: #8754b6; --f-synchro: #e6e6e1; --f-xyz: #2a2a30; --f-link: #2c6bb1; --f-spell: #1c9685; --f-trap: #b14487; --f-token: #868c94;
  --display: "Chakra Petch", "Trebuchet MS", system-ui, sans-serif; --body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --r: 10px; --cw: 62px; --ch: calc(var(--cw) * 1.458); --hw: 66px; --g: 5px;
}
@media (prefers-color-scheme: light) { :root:not([data-theme="dark"]) {
  color-scheme: light; --bg: #edf0ef; --surface: #ffffff; --surface-2: #f3f5f4; --line: #d3dad8; --fg: #142026; --muted: #5a6a72; --accent: #eaa92c; --accent-fg: #1c1303; --accent-ink: #8a5800; --bad: #c8372a; --good: #1f7a3f; } }
:root[data-theme="light"] { color-scheme: light; --bg: #edf0ef; --surface: #ffffff; --surface-2: #f3f5f4; --line: #d3dad8; --fg: #142026; --muted: #5a6a72; --accent: #eaa92c; --accent-fg: #1c1303; --accent-ink: #8a5800; --bad: #c8372a; --good: #1f7a3f; }

html, body { height: 100%; }
body { background: var(--bg); color: var(--fg); font: 15px/1.4 var(--body); -webkit-tap-highlight-color: transparent; overflow: hidden; touch-action: manipulation; overscroll-behavior: none; }
* { box-sizing: border-box; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--pick); outline-offset: 2px; }

.app { height: 100%; display: grid; grid-template-rows: auto auto minmax(0, 1fr); gap: 8px; padding-block: 8px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); max-width: 1320px; margin: 0 auto; }

/* ---- testata */
.top { display: flex; align-items: center; gap: 10px; min-width: 0; }
.brand { font: 700 19px/1 var(--display); letter-spacing: .02em; text-transform: uppercase; white-space: nowrap; }
.brand i { font-style: normal; color: var(--accent-ink); }
.tabs { margin-left: auto; display: flex; background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 3px; }
.tabs button { border: 0; background: none; padding: 6px 14px; border-radius: 999px; font: 600 14px var(--display); letter-spacing: .03em; color: var(--muted); }
.tabs button[aria-selected="true"] { background: var(--fg); color: var(--bg); }
.icon-btn { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; width: 36px; height: 36px; display: grid; place-items: center; flex: none; }
.icon-btn svg { width: 18px; height: 18px; }

.deckbar { display: flex; gap: 8px; align-items: stretch; min-width: 0; }
.deckbar select { flex: 1; min-width: 0; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 0 10px; height: 42px; font-weight: 600; text-overflow: ellipsis; }
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: var(--r); padding: 0 14px; min-height: 42px; font: 600 15px var(--display); letter-spacing: .02em; white-space: nowrap; display: inline-flex; align-items: center; justify-content: center; gap: 6px; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }
.btn.ghost { background: none; }
.btn.danger { color: var(--bad); }
.btn:disabled { opacity: .4; cursor: default; }
.btn.small { min-height: 34px; padding: 0 10px; font-size: 13px; }
.btn .n { font-variant-numeric: tabular-nums; opacity: .75; }

/* ---- zona di gioco */
.stage { min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr); grid-template-rows: minmax(0, 1fr); gap: 14px; }
.col { min-height: 0; min-width: 0; display: flex; flex-direction: column; gap: 8px; }
.table { flex: 1; min-height: 0; min-width: 0; display: flex; flex-direction: column; gap: 6px; overflow: hidden auto; }
.side { display: none; }
.status { display: flex; align-items: center; gap: 7px; font-size: 12.5px; color: var(--muted); min-width: 0; white-space: nowrap; overflow: hidden; }
.status b { color: var(--fg); font: 600 13px var(--display); font-variant-numeric: tabular-nums; }
.phases { display: flex; gap: 3px; }
.ph { font: 600 10.5px var(--display); letter-spacing: .04em; padding: 2px 4px; border-radius: 4px; border: 1px solid var(--line); color: var(--muted); }
.ph.on { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }
.status .sp { margin-left: auto; }
.warn-chip { border: 1px solid var(--bad); color: var(--bad); background: none; border-radius: 999px; padding: 1px 8px; font-size: 12px; }

.mat-wrap { background: radial-gradient(120% 90% at 50% 0%, var(--mat-1), var(--mat-2)); border-radius: 14px; padding: 8px; color: var(--mat-fg); display: flex; flex-direction: column; gap: 6px; align-items: center;
  box-shadow: inset 0 0 0 1px rgba(255,255,255,.06); }
.opp { align-self: stretch; display: flex; gap: 8px; align-items: center; font-size: 11.5px; color: var(--mat-muted); background: none; border: 0; padding: 0 2px; text-align: left; min-width: 0; }
.opp b { color: var(--mat-fg); font-weight: 600; }
.opp span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.mat { display: grid; gap: var(--g); grid-template-columns: repeat(5, var(--cw)); justify-content: center;
  grid-template-areas: ". e1 . e2 ." "m1 m2 m3 m4 m5" "s1 s2 s3 s4 s5" "fz gy bn ex dk"; }
.zone { width: var(--cw); height: var(--ch); border-radius: calc(var(--cw) * .08); border: 1px dashed var(--mat-line); background: var(--mat-zone); position: relative; display: grid; place-items: center; padding: 0; color: inherit; }
.zone.emz { border-style: solid; border-color: rgba(242,180,65,.5); }
.zone.pointed { background: rgba(85,214,234,.13); border-color: rgba(85,214,234,.55); }
.zone .zl { font: 600 calc(var(--cw) * .13) var(--display); letter-spacing: .08em; text-transform: uppercase; color: var(--mat-muted); opacity: .7; text-align: center; }
.zone.pick { border: 2px solid var(--pick); background: rgba(85,214,234,.2); cursor: pointer; animation: pulse 1.1s ease-in-out infinite; }
.zone.pick .zl { color: var(--pick); opacity: 1; }
.zone.fz, .pile { height: calc(var(--ch) * .52); }
@keyframes pulse { 50% { background: rgba(85,214,234,.34); } }

.pile { width: var(--cw); border-radius: calc(var(--cw) * .08); border: 1px solid var(--mat-line); background: rgba(0,0,0,.28); position: relative; overflow: hidden; padding: 0; color: var(--mat-fg); display: grid; place-items: center; }
.pile img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 50% 26%; opacity: .5; }
.pile .back { position: absolute; inset: 0; background: repeating-linear-gradient(135deg, #3a2a1c 0 5px, #4a3524 5px 10px); opacity: .55; }
.pile .meta { position: relative; display: flex; flex-direction: column; align-items: center; line-height: 1; gap: 2px; text-shadow: 0 1px 3px #000; }
.pile .meta b { font: 700 calc(var(--cw) * .3) var(--display); font-variant-numeric: tabular-nums; }
.pile .meta i { font: 600 calc(var(--cw) * .135) var(--display); font-style: normal; letter-spacing: .06em; text-transform: uppercase; color: var(--mat-fg); opacity: .85; }
.pile.act { box-shadow: 0 0 0 2px var(--accent), 0 0 12px rgba(242,180,65,.55); }

/* ---- carte */
.card { --w: var(--cw); width: var(--w); height: calc(var(--w) * 1.458); border-radius: calc(var(--w) * .07); border: 0; padding: 0; position: relative; overflow: hidden; display: block; flex: none;
  background: var(--fc, #555); color: #14110c; box-shadow: 0 1px 3px rgba(0,0,0,.5); text-align: left; transition: transform .12s ease; }
.card img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; pointer-events: none; }
img.rimg:not(.ok) { visibility: hidden; }
.card, .pile { -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; touch-action: manipulation; }
.card.f-normal { --fc: var(--f-normal); } .card.f-effect { --fc: var(--f-effect); } .card.f-ritual { --fc: var(--f-ritual); } .card.f-fusion { --fc: var(--f-fusion); }
.card.f-synchro { --fc: var(--f-synchro); } .card.f-xyz { --fc: var(--f-xyz); } .card.f-link { --fc: var(--f-link); } .card.f-spell { --fc: var(--f-spell); } .card.f-trap { --fc: var(--f-trap); } .card.f-token { --fc: var(--f-token); }
.card.f-xyz, .card.f-link, .card.f-fusion, .card.f-trap, .card.f-ritual { color: #fff; }
.card.f-synchro .art, .card.f-normal .art { background: rgba(0,0,0,.42); }
.face { position: absolute; inset: calc(var(--w) * .055); display: flex; flex-direction: column; gap: calc(var(--w) * .04); }
.face .nm { font: 600 calc(var(--w) * .135)/1.12 var(--body); display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; overflow-wrap: anywhere; }
.face .art { flex: 1; min-height: 0; border-radius: calc(var(--w) * .04); background: rgba(0,0,0,.2); display: grid; place-items: center; font: 700 calc(var(--w) * .2)/1 var(--display); color: rgba(255,255,255,.9); text-align: center; }
.face .art small { display: block; font-size: .55em; letter-spacing: .06em; opacity: .85; margin-top: .25em; }
.face .st { font: 600 calc(var(--w) * .135)/1 var(--display); font-variant-numeric: tabular-nums; text-align: right; white-space: nowrap; }
.card .strip { position: absolute; left: 0; right: 0; bottom: 0; background: rgba(8,10,12,.82); color: #fff; font: 600 calc(var(--w) * .15)/1.5 var(--display); font-variant-numeric: tabular-nums; text-align: center; }
.card .strip.mod { color: var(--accent); }
.card .badge { position: absolute; top: 3px; right: 3px; min-width: 1.5em; padding: 0 .3em; border-radius: 999px; background: #0b0d0f; color: #fff; font: 700 calc(var(--w) * .16)/1.5 var(--display); text-align: center; box-shadow: 0 0 0 1px rgba(255,255,255,.4); }
.card .badge.neg { left: 3px; right: auto; background: var(--bad); color: #fff; }
.card.fd::after { content: "COPERTA"; position: absolute; inset: 0; background: repeating-linear-gradient(135deg, rgba(20,14,8,.62) 0 6px, rgba(40,28,16,.5) 6px 12px); color: #fff; text-shadow: 0 1px 3px #000; display: grid; place-items: center; font: 700 calc(var(--w) * .13) var(--display); letter-spacing: .08em; }
.zone .card.def { transform: rotate(90deg) scale(.685); }
.card.act { box-shadow: 0 0 0 2px var(--accent), 0 0 14px 1px rgba(242,180,65,.7); }
.card.sel { box-shadow: 0 0 0 3px var(--pick), 0 0 14px 1px rgba(85,214,234,.7); }
.card.dim { opacity: .45; }
.lk { position: absolute; width: 0; height: 0; border: calc(var(--w) * .06) solid transparent; }
.lk.u { top: 1px; left: 50%; margin-left: calc(var(--w) * -.06); border-bottom-color: #ff5a47; border-top: 0; }
.lk.d { bottom: 1px; left: 50%; margin-left: calc(var(--w) * -.06); border-top-color: #ff5a47; border-bottom: 0; }
.lk.l { left: 1px; top: 50%; margin-top: calc(var(--w) * -.06); border-right-color: #ff5a47; border-left: 0; }
.lk.r { right: 1px; top: 50%; margin-top: calc(var(--w) * -.06); border-left-color: #ff5a47; border-right: 0; }
.lk.ul { top: 1px; left: 1px; border-top-color: #ff5a47; border-left-color: #ff5a47; border-width: calc(var(--w) * .045); }
.lk.ur { top: 1px; right: 1px; border-top-color: #ff5a47; border-right-color: #ff5a47; border-width: calc(var(--w) * .045); }
.lk.dl { bottom: 1px; left: 1px; border-bottom-color: #ff5a47; border-left-color: #ff5a47; border-width: calc(var(--w) * .045); }
.lk.dr { bottom: 1px; right: 1px; border-bottom-color: #ff5a47; border-right-color: #ff5a47; border-width: calc(var(--w) * .045); }
.zone.fz .card { width: 100%; height: 100%; }
.zone.fz .card img { object-position: 50% 26%; }
.zone.fz .card .face .art, .zone.fz .card .face .st { display: none; }

.minilog { flex: 1; min-height: 22px; border: 0; background: none; padding: 0 2px; text-align: left; overflow: hidden; display: flex; flex-direction: column; justify-content: flex-end; }
.minilog .log { overflow: hidden; font-size: 12.5px; gap: 1px; } .minilog .log div { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; } .minilog .log .d { display: none; }
.handhead { display: flex; gap: 6px; align-items: center; font: 600 11px var(--display); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); min-width: 0; }
.handhead > span { white-space: nowrap; } .handhead .grow { flex: 1; }
.handhead .note { text-transform: none; letter-spacing: 0; font: 500 12px var(--body); color: var(--accent-ink); overflow: hidden; text-overflow: ellipsis; }
.handhead .btn { text-transform: none; letter-spacing: .01em; min-height: 30px; padding: 0 9px; font-size: 12.5px; color: var(--fg); }
.hand { display: flex; gap: 6px; overflow-x: auto; padding: 4px 3px 8px; min-height: calc(var(--hw) * 1.458 + 12px); scrollbar-width: thin; align-items: flex-start; }
.hand .card { --w: var(--hw); }
.hand.tight { gap: 6px; }
.hand.tight .card + .card { margin-left: var(--ov, 0px); }
.hand .card.act { transform: translateY(-3px); }
.hand-empty { color: var(--muted); font-size: 13px; align-self: center; }

/* ---- barra azioni */
.actions { display: flex; gap: 8px; align-items: center; min-width: 0; }
.actions .msg { flex: 1; min-width: 0; font-size: 13.5px; color: var(--muted); }
.actions .msg b { color: var(--pick); font-weight: 600; }
.actions .grow { flex: 1; }

/* ---- colonna destra (PC) */
.insp { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 12px; display: flex; flex-direction: column; gap: 10px; min-height: 0; }
.insp-head { display: flex; gap: 12px; align-items: flex-start; }
.insp-head .card { --w: 112px; cursor: default; }
.insp-head h3 { margin: 0 0 4px; font: 700 17px/1.15 var(--display); text-wrap: balance; }
.tl { font-size: 12.5px; color: var(--muted); } .sl { font: 600 13px var(--display); margin-top: 3px; font-variant-numeric: tabular-nums; }
.where { font-size: 11.5px; color: var(--accent-ink); margin-top: 4px; text-transform: uppercase; letter-spacing: .05em; font-weight: 600; }
.ctext { font-size: 13.5px; line-height: 1.5; white-space: pre-wrap; overflow-wrap: anywhere; }
.acts { display: flex; flex-direction: column; gap: 6px; }
.acts button { text-align: left; border: 1px solid var(--accent); background: color-mix(in srgb, var(--accent) 14%, var(--surface)); border-radius: 9px; padding: 9px 12px; font-weight: 600; font-size: 14px; line-height: 1.25; }
.acts button small { display: block; font-weight: 400; color: var(--muted); font-size: 12.5px; margin-top: 2px; }
.empty-hint { color: var(--muted); font-size: 13.5px; }
.logbox { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 10px 12px; min-height: 0; display: flex; flex-direction: column; gap: 6px; }
.logbox h4, .sec-h { margin: 0; font: 600 11px var(--display); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); display: flex; justify-content: space-between; }
.log { overflow: auto; font-size: 13px; line-height: 1.45; display: flex; flex-direction: column; gap: 2px; min-height: 0; }
.log div { overflow-wrap: anywhere; } .log .turn { font: 600 11px var(--display); letter-spacing: .1em; text-transform: uppercase; color: var(--accent-ink); margin-top: 6px; }
.log .move, .log .info, .log .draw { color: var(--muted); } .log .move b, .log .draw b { color: var(--fg); font-weight: 500; }
.log .d { color: var(--muted); } .log i { font-style: normal; color: var(--accent-ink); } .log .neg { color: var(--bad); }

/* ---- fogli */
.sheet-back { position: fixed; inset: 0; background: rgba(4,8,10,.6); display: flex; align-items: flex-end; justify-content: center; z-index: 30; }
.sheet { background: var(--surface); color: var(--fg); width: 100%; max-width: 640px; max-height: 88%; overflow: auto; border-radius: 18px 18px 0 0; display: flex; flex-direction: column; gap: 12px;
  padding: 16px max(16px, env(safe-area-inset-right, 0px)) calc(16px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); box-shadow: 0 -8px 40px rgba(0,0,0,.5); }
.sheet h3 { margin: 0; font: 700 18px/1.2 var(--display); text-wrap: balance; }
.sheet .sub { margin: 0; color: var(--muted); font-size: 13.5px; }
.sheet .row { display: flex; gap: 8px; flex-wrap: wrap; }
.sheet .row .btn { flex: 1; }
.sheet > .row:last-child { position: sticky; bottom: 0; background: var(--surface); padding-top: 10px; padding-bottom: calc(16px + env(safe-area-inset-bottom, 0px)); margin-bottom: calc(-16px - env(safe-area-inset-bottom, 0px)); z-index: 2; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(84px, 1fr)); gap: 12px 10px; }
.tile { display: flex; flex-direction: column; gap: 4px; align-items: center; min-width: 0; position: relative; }
.tile .card { --w: 78px; }
.tile .pn { font-size: 11.5px; line-height: 1.2; text-align: center; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; overflow-wrap: anywhere; }
.tile .wh { font-size: 10.5px; color: var(--accent-ink); text-transform: uppercase; letter-spacing: .05em; font-weight: 600; text-align: center; }
.tile .info { position: absolute; top: -6px; right: 0; width: 26px; height: 26px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface-2); font: 700 13px var(--display); display: grid; place-items: center; padding: 0; z-index: 1; }
.tile .mini { border: 1px solid var(--accent); background: color-mix(in srgb, var(--accent) 14%, var(--surface)); border-radius: 7px; font-size: 11.5px; font-weight: 600; padding: 4px 6px; width: 100%; line-height: 1.15; }
.opts { display: flex; flex-direction: column; gap: 6px; }
.opts button { text-align: left; border: 1px solid var(--line); background: var(--surface-2); border-radius: 10px; padding: 10px 12px; display: flex; gap: 10px; align-items: center; min-width: 0; }
.opts button .card { --w: 38px; } .opts button div { min-width: 0; }
.opts .k { font-weight: 600; display: block; } .opts .dsc { font-size: 12.5px; color: var(--muted); display: block; overflow-wrap: anywhere; }
.tips div { background: var(--surface-2); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; font-size: 14px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { border: 1px solid var(--line); background: var(--surface-2); border-radius: 999px; padding: 6px 12px; font-size: 13.5px; }
.chip.on { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); font-weight: 600; }
.yn { display: flex; gap: 12px; align-items: flex-start; } .yn .card { --w: 84px; }
.field { background: var(--surface-2); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; width: 100%; }
textarea.field { min-height: 130px; font: 13px/1.4 ui-monospace, Menlo, Consolas, monospace; resize: vertical; }
.set-row { display: flex; gap: 12px; align-items: flex-start; padding: 8px 0; border-top: 1px solid var(--line); }
.set-row input { width: 20px; height: 20px; margin-top: 2px; accent-color: var(--accent); flex: none; }
.set-row b { display: block; font-weight: 600; } .set-row span { color: var(--muted); font-size: 13px; }
.lic { font-size: 12.5px; color: var(--muted); line-height: 1.5; } .lic a { color: var(--accent-ink); }

// ---------------------------------------------------------------- mazzi

  if (deck.main.length < 40) w.push(`Mazzo principale di ${deck.main.length} carte: il minimo è 40.`);
  if (deck.main.length > 60) w.push(`Mazzo principale di ${deck.main.length} carte: il massimo è 60.`);
  if (deck.extra.length > 15) w.push(`Extra Deck di ${deck.extra.length} carte: il massimo è 15.`);
  const cnt = new Map(); for (const c of [...deck.main, ...deck.extra]) { const k = db.c(c)?.[0] || c; cnt.set(k, (cnt.get(k) || 0) + 1); }
  for (const [k, n] of cnt) if (n > 3) w.push(`${db.name(k)}: ${n} copie (il massimo è 3).`);
  return w;
}

function rng(seed) { let s = seed >>> 0 || 1; return () => { s = (Math.imul(s, 1664525) + 1013904223) >>> 0; return s / 4294967296; }; }

// ---------------------------------------------------------------- risposte automatiche
function freePlaces(mask, player = 0) {
  const out = [];
  for (const [p, sh] of [[player, 0], [1 - player, 16]]) { const m = (mask >>> sh) & 0xffff;
    for (let i = 0; i < 7; i++) if (!(m & (1 << i))) out.push({ player: p, location: LOC.MZONE, sequence: i });
    for (let i = 0; i < 8; i++) if (!(m & (1 << (8 + i)))) out.push({ player: p, location: LOC.SZONE, sequence: i }); }
  return out;
}
// risposta "neutra" a qualsiasi richiesta: la usa l'avversario fantoccio (passa sempre) e i casi che l'app decide da sola
function autoResponse(m) {
  switch (m.type) {
    case M.SELECT_IDLECMD: return { type: R.IDLECMD, action: m.to_ep ? 7 : 6, index: null };
    case M.SELECT_BATTLECMD: return m.to_ep || m.to_m2 || !m.attacks.length ? { type: R.BATTLECMD, action: m.to_ep ? 3 : 2, index: null } : { type: R.BATTLECMD, action: 1, index: 0 };
    case M.SELECT_CHAIN: return { type: R.CHAIN, index: m.forced ? 0 : null };
    case M.SELECT_EFFECTYN: return { type: R.EFFECTYN, yes: false };
    case M.SELECT_YESNO: return { type: R.YESNO, yes: false };
    case M.SELECT_OPTION: return { type: R.OPTION, index: 0 };
    case M.SELECT_CARD: return { type: R.CARD, indicies: [...Array(Math.max(1, m.min)).keys()] };
    case M.SELECT_TRIBUTE: return { type: R.TRIBUTE, indicies: [...Array(Math.max(1, m.min)).keys()] };
    case M.SELECT_UNSELECT_CARD: return { type: R.UNSELECT, index: m.can_finish ? null : 0 };
    case M.SELECT_PLACE: return { type: R.PLACE, places: freePlaces(m.field_mask, m.player).slice(0, m.count) };
    case M.SELECT_DISFIELD: return { type: R.DISFIELD, places: freePlaces(m.field_mask, m.player).slice(0, m.count) };
    case M.SELECT_POSITION: for (const p of [1, 4, 2, 8]) if (m.positions & p) return { type: R.POSITION, position: p }; return { type: R.POSITION, position: 1 };
    case M.SELECT_SUM: return { type: R.SUM, indicies: [...m.selects_must.keys(), m.selects_must.length] };
    case M.SELECT_COUNTER: return { type: R.COUNTER, counters: m.cards.map((_, i) => (i === 0 ? m.count : 0)) };
    case M.SORT_CARD: case M.SORT_CHAIN: return { type: R.SORT, order: null };
    case M.RPS: return { type: R.RPS, value: 1 };
    case M.ANNOUNCE_NUMBER: return { type: R.NUMBER, value: 0 };
    case M.ANNOUNCE_RACE: return { type: R.RACE, races: [] };
    case M.ANNOUNCE_ATTRIB: return { type: R.ATTRIB, attributes: [] };
    case M.ANNOUNCE_CARD: return { type: R.ACARD, card: DUMMY };
  }
  return null;
}

// ---------------------------------------------------------------- una partita di prova
// Una Session è un duello contro un avversario che non fa nulla. Tutte le risposte del giocatore
// vengono registrate: "annulla" ricrea il duello con lo stesso seme e rigioca le risposte tranne l'ultima.
class Session {
  constructor(lib, db, scripts, opts = {}) {
    this.lib = lib; this.db = db; this.scripts = scripts; this.h = null;
    this.opts = { chainAll: false, autoZoneMon: false, autoZoneST: true, autoSingle: false, autoAtk: false, ...opts };
  }
  // setup: { main, extra, forced: [codici da avere in mano], seed, stack?: [ordine fisso del mazzo, solo test] }
  start(setup) { this.setup = setup; this.responses = []; this._create(); return this.run(); }
  _create() {
    const { main, extra, forced = [], seed, stack = null } = this.setup, db = this.db, scripts = this.scripts, lib = this.lib;
    if (this.h) { try { lib.destroyDuel(this.h); } catch (e) {} this.h = null; }
    this.log = []; this.pending = null; this.ended = false; this.turn = 0; this.turnPlayer = 0; this.phase = 0; this.errors = []; this.hint = ""; this.retry = false; this.chain = 0; this._grp = null;
    this.stats = { ns: 0, sp: 0, act: 0 };
    const rest = main.slice(), hand = [];
    for (const c of forced) { const i = rest.indexOf(c); if (i >= 0 && hand.length < 5) { rest.splice(i, 1); hand.push(c); } }
    // il motore non mescola da solo all'inizio (in EDOPro lo fa il programma): mescolo qui con il seme della partita.
    // Le mescolate durante il duello (dopo una ricerca, ecc.) le fa invece il motore, sempre a partire dal seme.
    const rnd = rng(seed); for (let i = rest.length - 1; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); [rest[i], rest[j]] = [rest[j], rest[i]]; }
    const s = BigInt((seed >>> 0) || 1);
    const h = lib.createDuel({ flags: MODE_MR5 | (stack ? 16n : 0n), seed: [s, s * 6364136223846793005n & 0xffffffffffffffffn, 1442695040888963407n, s ^ 0x9e3779b97f4a7c15n],
      team1: { startingLP: 8000, startingDrawCount: stack ? 5 : 5 - hand.length, drawCountPerTurn: 1 }, team2: { startingLP: 8000, startingDrawCount: 5, drawCountPerTurn: 1 },
      cardReader: (code) => db.data(code) || { code, alias: 0, setcodes: [], type: 0, level: 0, attribute: 0, race: 0n, attack: 0, defense: 0, lscale: 0, rscale: 0, link_marker: 0 },
      scriptReader: (name) => { const b = name.split("/").pop(); return scripts[b] ?? null; },
      errorHandler: (t, text) => { this.errors.push(String(text)); } });
    if (!h) throw new Error("impossibile creare il duello");
    this.h = h;
    for (const b of ["constant.lua", "utility.lua"]) lib.loadScript(h, b, scripts[b]);
    const add = (team, code, location) => lib.duelNewCard(h, { team, duelist: 0, code, controller: team, location, sequence: 0, position: POS.FD_DEF });
    if (stack) { for (let i = stack.length - 1; i >= 0; i--) add(0, stack[i], LOC.DECK); }
    else { for (const c of rest) add(0, c, LOC.DECK); for (const c of hand) add(0, c, LOC.HAND); }
    for (const c of extra) add(0, c, LOC.EXTRA);
    for (let i = 0; i < 40; i++) add(1, DUMMY, LOC.DECK);
    lib.startDuel(h);
  }
  _say(html, kind = "") { this.log.push({ html, kind }); this._grp = null; }
  // raggruppa spostamenti uguali consecutivi: "Dal mazzo al cimitero: A, B, C"
  _move(label, code) {
    const n = `<b>${esc(this.db.name(code))}</b>`;
    if (this._grp && this._grp.label === label) { this._grp.entry.html += ", " + n; return; }
    const entry = { html: `${label}: ${n}`, kind: "move" }; this.log.push(entry); this._grp = { label, entry };
  }
  _note(m) {
    const db = this.db, n = (c) => `<b>${esc(db.name(c))}</b>`, opp = (p) => (p === 0 ? "" : "Avversario: ");
    switch (m.type) {
      case M.NEW_TURN: this.turn++; this.turnPlayer = m.player; this._say(`Turno ${this.turn} · ${m.player === 0 ? "tuo" : "avversario"}`, "turn"); break;
      case M.NEW_PHASE: this.phase = m.phase; break;
      case M.HINT: if (m.hint_type === 3 && m.player === 0) this.hint = db.desc(m.hint); break;
      case M.RETRY: this.retry = true; break;
      case M.WIN: this.ended = true; this._say(m.player === 0 ? "Hai vinto il duello" : "Duello perso", "turn"); break;
      case M.MOVE: {
        const f = m.from || {}, t = m.to || {}; const fl = f.location & 0x7f, tl = t.location & 0x7f; if (!m.card) break;
        const who = (t.controller ?? f.controller) === 1 ? "Avversario · " : "";
        if (tl === LOC.GRAVE) this._move(`${who}${fl === LOC.DECK ? "Dal mazzo al cimitero" : fl === LOC.HAND ? "Dalla mano al cimitero" : fl === LOC.EXTRA ? "Dall'Extra al cimitero" : "Al cimitero"}`, m.card);
        else if (tl === LOC.REMOVED) this._move(`${who}Bandita${t.position & POS.FACEDOWN ? " coperta" : ""}`, m.card);
        else if (tl === LOC.HAND && fl !== LOC.DECK) this._move(`${who}Torna in mano`, m.card);
        else if (tl === LOC.HAND && this.turn > 0) this._move(`${who}Aggiunta alla mano`, m.card);
        else if (tl === LOC.DECK && fl !== LOC.DECK) this._move(`${who}Torna nel mazzo`, m.card);
        else if (tl === LOC.EXTRA && fl !== LOC.EXTRA) this._move(`${who}Torna nell'Extra Deck`, m.card);
        else if ((t.location & LOC.OVERLAY) && !(f.location & LOC.OVERLAY)) this._move(`${who}Diventa materiale Xyz`, m.card);
        break; }
      case M.SUMMONING: this.stats.ns += m.controller === 0; this._say(`${opp(m.controller)}Evocazione Normale: ${n(m.code)}`, "sum"); break;
      case M.SPSUMMONING: this.stats.sp += m.controller === 0; this._say(`${opp(m.controller)}Evocazione Speciale: ${n(m.code)}`, "sum"); break;
      case M.FLIPSUMMONING: this._say(`${opp(m.controller)}Evocazione per Scoperta: ${n(m.code)}`, "sum"); break;
      case M.SET: this._say(`${opp(m.controller)}Posizionata coperta${m.code ? ": " + n(m.code) : ""}`, "set"); break;
      case M.CHAINING: { this.stats.act += m.controller === 0; this.chain = m.chain_size; const d = db.desc(m.description);
        this._say(`${opp(m.controller)}Attivi ${n(m.code)}${m.chain_size > 1 ? ` <i>anello ${m.chain_size}</i>` : ""}${d ? `<span class="d"> — ${esc(d)}</span>` : ""}`, "act"); break; }
      case M.CHAIN_NEGATED: case M.CHAIN_DISABLED: this._say(`Anello ${m.chain_size} annullato`, "neg"); break;
      case M.CHAIN_END: this.chain = 0; break;
      case M.SHUFFLE_DECK: if (m.player === 0 && this.turn > 0) this._say("Mazzo mescolato", "info"); break;
      case M.CONFIRM_DECKTOP: if (m.player === 0 && m.cards?.length) this._say(`Carte rivelate dalla cima del mazzo: ${m.cards.map((c) => n(c.code)).join(", ")}`, "info"); break;
      case M.DRAW: if (m.player === 0 && this.turn > 0) this._say(`Peschi: ${m.drawn.map((d) => n(d.code)).join(", ")}`, "draw"); break;
      case M.PAY_LPCOST: this._say(`${opp(m.player)}Paghi ${m.amount} LP`, "info"); break;
      case M.DAMAGE: this._say(`${m.player === 0 ? "Subisci" : "L'avversario subisce"} ${m.amount} danni`, "info"); break;
      case M.RECOVER: this._say(`${m.player === 0 ? "Recuperi" : "L'avversario recupera"} ${m.amount} LP`, "info"); break;
      case M.ATTACK: this._say(`${opp(m.attacker?.controller ?? 0)}Attacco dichiarato`, "info"); break;
    }
  }
  // decide se una richiesta va gestita senza disturbare il giocatore; ritorna la risposta o null
  _auto(ask) {
    const o = this.opts;
    switch (ask.type) {
      case M.SORT_CHAIN: case M.SORT_CARD: case M.SELECT_COUNTER: case M.RPS: return autoResponse(ask);
      case M.SELECT_POSITION: return o.autoAtk && (ask.positions & POS.FU_ATK) ? { type: R.POSITION, position: POS.FU_ATK } : null;
      // scelte obbligate: una sola risposta possibile, quindi niente da decidere
      case M.SELECT_CARD: return o.autoSingle && ask.selects.length === 1 && ask.min === 1 && !ask.can_cancel ? { type: R.CARD, indicies: [0] } : null;
      case M.SELECT_TRIBUTE: return o.autoSingle && ask.selects.length === 1 && ask.min === 1 && !ask.can_cancel ? { type: R.TRIBUTE, indicies: [0] } : null;
      case M.SELECT_UNSELECT_CARD: return o.autoSingle && ask.select_cards.length === 1 && !ask.unselect_cards.length && !ask.can_finish && !ask.can_cancel ? { type: R.UNSELECT, index: 0 } : null;
      case M.SELECT_OPTION: return o.autoSingle && ask.options.length === 1 ? { type: R.OPTION, index: 0 } : null;
      case M.SELECT_CHAIN:
        if (ask.forced) return null;
        if (!ask.selects.length) return { type: R.CHAIN, index: null };
        // come EDOPro: senza "chiedi sempre" le finestre senza effetti a innesco si passano da sole
        // spe_count 127 = effetti a innesco: si chiede sempre. Il resto sono finestre per effetti rapidi:
        // di base si passano da sole (gli effetti rapidi restano attivabili dal menu della carta a catena vuota).
        if (ask.spe_count === 127) return null;
        if (ask.spe_count === 0 || !o.chainAll) return { type: R.CHAIN, index: null };
        return null;
      case M.SELECT_PLACE: case M.SELECT_DISFIELD: {
        const free = freePlaces(ask.field_mask, 0); if (free.length <= ask.count) return { type: ask.type === M.SELECT_PLACE ? R.PLACE : R.DISFIELD, places: free.slice(0, ask.count) };
        if (ask.type === M.SELECT_DISFIELD || ask.count !== 1 || free.some((p) => p.player !== 0)) return null;
        const st = free.every((p) => p.location === LOC.SZONE);
        if (st && o.autoZoneST) return { type: R.PLACE, places: [free[0]] };
        if (!st && o.autoZoneMon) { const main = free.filter((p) => p.location === LOC.MZONE && p.sequence < 5); return { type: R.PLACE, places: [main[0] || free[0]] }; }
        return null; }
    }
    return null;
  }
  run(replay = null) {
    const lib = this.lib, h = this.h;
    for (let guard = 0; guard < 50000; guard++) {
      const st = lib.duelProcess(h); const msgs = lib.duelGetMessage(h); let ask = null;
      for (const m of msgs) { this._note(m); if (ASK.has(m.type)) ask = m; }
      if (st === 0) { this.ended = true; this.pending = null; return null; }
      if (st === 2) continue;
      if (!ask) { if (this.retry && this.pending) return this.pending; this.errors.push("il motore è in attesa senza una richiesta"); this.pending = null; return null; }
      if (ask.player === 1) { lib.duelSetResponse(h, autoResponse(ask)); continue; }
      if (replay && replay.length) { lib.duelSetResponse(h, replay.shift().r); continue; }
      const auto = this._auto(ask);
      if (auto) { this.responses.push({ r: auto, auto: true }); lib.duelSetResponse(h, auto); continue; }
      this.pending = ask; return ask;
    }
    this.errors.push("troppi passi senza una richiesta: possibile ciclo"); this.pending = null; return null;
  }
  // risposta del giocatore. Se il motore la rifiuta resta in attesa della stessa richiesta: invalid = true.
  respond(resp) {
    const prev = this.pending, n = this.responses.length, hint = this.hint; this.retry = false; this.invalid = false; this.hint = "";
    this.responses.push({ r: resp, auto: false }); this.lib.duelSetResponse(this.h, resp);
    const ask = this.run();
    if (this.retry) { this.retry = false; this.invalid = true; this.responses.length = n; this.pending = prev; this.hint = hint; return prev; }
    return ask;
  }
  _replay(keep) { this._create(); this.responses = keep.slice(); return this.run(keep.slice()); }
  get moves() { return this.responses.filter((x) => !x.auto).length; }
  undo() {
    const keep = this.responses.slice(); while (keep.length && keep[keep.length - 1].auto) keep.pop();
    if (!keep.length) return this.pending; keep.pop();
    return this._replay(keep);
  }
  // "ci ripenso": torna a prima dell'ultima cosa che il giocatore ha deciso di iniziare
  // (un'azione dal tavolo, un "sì" a un effetto, un effetto scelto in catena), annullando tutte le scelte fatte dopo.
  undoAction() {
    const keep = this.responses.slice(); let j = -1;
    for (let i = keep.length - 1; i >= 0; i--) { const x = keep[i]; if (x.auto) continue; const r = x.r;
      if (r.type === R.IDLECMD || r.type === R.BATTLECMD || (r.type === R.EFFECTYN && r.yes) || (r.type === R.CHAIN && r.index != null)) { j = i; break; } }
    if (j < 0) return this.pending;
    return this._replay(keep.slice(0, j));
  }
  restart() { this.responses = []; this._create(); return this.run(); }
  destroy() { if (this.h) { try { this.lib.destroyDuel(this.h); } catch (e) {} this.h = null; } }
  zone(p, l) { try { return this.lib.duelQueryLocation(this.h, { flags: Q_FLAGS, controller: p, location: l }) || []; } catch (e) { return []; } }
  count(p, l) { try { return this.lib.duelQueryCount(this.h, p, l); } catch (e) { return 0; } }
  lp() { try { return this.lib.duelQueryField(this.h).players.map((p) => p.lp); } catch (e) { return [8000, 8000]; } }
}

// azioni possibili per una carta in una certa posizione, data la richiesta in corso
function actionsFor(db, ask, loc, seq, code, controller = 0) {
  const out = []; if (!ask) return out;
  const same = (c) => c.location === loc && c.sequence === seq && c.controller === controller && (code == null || c.code === code);
  const act = (c) => { const d = db.desc(c.description); return d ? "Attiva: " + d : "Attiva effetto"; };
  if (ask.type === M.SELECT_IDLECMD) {
    ask.summons.forEach((c, i) => same(c) && out.push({ label: "Evocazione Normale", kind: "summon", r: { type: R.IDLECMD, action: 0, index: i } }));
    ask.special_summons.forEach((c, i) => same(c) && out.push({ label: "Evocazione Speciale", kind: "sp", r: { type: R.IDLECMD, action: 1, index: i } }));
    ask.activates.forEach((c, i) => same(c) && out.push({ label: act(c), kind: "act", r: { type: R.IDLECMD, action: 5, index: i } }));
    ask.monster_sets.forEach((c, i) => same(c) && out.push({ label: "Posiziona coperto", kind: "set", r: { type: R.IDLECMD, action: 3, index: i } }));
    ask.spell_sets.forEach((c, i) => same(c) && out.push({ label: "Posiziona coperta", kind: "set", r: { type: R.IDLECMD, action: 4, index: i } }));
    ask.pos_changes.forEach((c, i) => same(c) && out.push({ label: "Cambia posizione", kind: "pos", r: { type: R.IDLECMD, action: 2, index: i } }));
  } else if (ask.type === M.SELECT_BATTLECMD) {
    ask.chains.forEach((c, i) => same(c) && out.push({ label: act(c), kind: "act", r: { type: R.BATTLECMD, action: 0, index: i } }));
    ask.attacks.forEach((c, i) => same(c) && out.push({ label: c.can_direct ? "Attacca (anche diretto)" : "Attacca", kind: "atk", r: { type: R.BATTLECMD, action: 1, index: i } }));
  } else if (ask.type === M.SELECT_CHAIN) {
    ask.selects.forEach((c, i) => same(c) && out.push({ label: act(c), kind: "act", r: { type: R.CHAIN, index: i } }));
  }
  return out;
}

async function gunzipJSON(url) {
  const res = await fetch(url); if (!res.ok) throw new Error(`${url}: risposta ${res.status}`);
  const bin = atob((await res.text()).trim()); const bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  if (typeof DecompressionStream === "undefined") throw new Error("questo browser è troppo vecchio per aprire i dati delle carte (manca DecompressionStream): aggiornalo");
  const ds = new Blob([bytes]).stream().pipeThrough(new DecompressionStream("gzip"));
  return JSON.parse(await new Response(ds).text());
}

}

async function importText(text, name) {
  const r = parseDeckText(DB, text);
  if (!r.main.length && !r.extra.length) { toast("Non ho riconosciuto nessuna carta in " + (name || "questa lista")); return null; }
  const deck = { id: uid(), name: (name || "Mazzo importato").replace(/\.(ydk|txt)$/i, "").slice(0, 60), main: r.main, extra: r.extra };
  S.decks.push(deck); saveDecks();
  if (r.miss.length) S.sheet = { kind: "html", html: `<h3>Mazzo importato, ma ${r.miss.length === 1 ? "una carta non è stata riconosciuta" : r.miss.length + " carte non sono state riconosciute"}</h3><p class="sub">Sono state lasciate fuori. Può succedere con carte non ufficiali o appena annunciate.</p><div class="ctext">${esc(r.miss.join("\n"))}</div><div class="row"><button class="btn primary" data-act="close">Ho capito</button></div>` };
